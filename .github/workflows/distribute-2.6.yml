on:
  push:
    tags:
      - '2.6.*' # secrets are tied to version 2.6
  workflow_dispatch: # allow manual triggering from GitHub page

jobs:
  distribute:
    permissions:
      contents: write # for action-gh-release
      id-token: write # for actions/attest-build-provenance
      attestations: write # for actions/attest-build-provenance
      #   required but does not work in `act`! bug: https://github.com/nektos/act/issues/6025
      artifact-metadata: write # for actions/attest-build-provenance

    # The secrets created by `dksrc/dk0 prepare-version --ci github VERSION`
    # are tied to this environment only.
    environment: dk-distribution

    strategy:
      fail-fast: true
      matrix:
        include:
          - runs-on: windows-2022 # CommonsBase_Std requires Windows to use S7z
            distscript: dist-win32.u
            execution-abi: Windows_x86_64

    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Harden Runner # Optional but recommended
        uses: step-security/harden-runner@f808768d1510423e83855289c910610ca9b43176 # v2.17.0
        with: { egress-policy: audit }
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Distribute Modules
        uses: diskuv/dk-distribute@v3
        env:
            # PERMANENT explicit driver pin (the CommonsBase_Dk doctrine):
            # without it the launcher floats on whatever manifest the site
            # serves. Bump deliberately when adopting a new driver release.
            DK0_BASE_URL: https://gitlab.com/api/v4/projects/60486861/packages/generic/dk-dist/2.4.2.309
        with:
            standalone: true
            pubkey: ${{ secrets.distribute_2_6_pubkey }}
            seckey: ${{ secrets.distribute_2_6_seckey }}
            options: -nosysinc
            # store: none: build the new Extract@0.1.1 fresh
            store: none
            distscript: ${{ matrix.distscript }}
            execution-abi: ${{ matrix.execution-abi }}
            experimental-dk-owner: ${{ github.repository_owner == 'dkpkg' && 'diskuv' || github.repository_owner }}
            #   Use MlFront HEAD when CI build is not from a tag
            experimental-mlfront-ref: ${{ github.ref_type != 'tag' && 'HEAD' }}
            #   Uncomment when testing MlFront
            # experimental-mlfront-ref: HEAD

      # Attests the distribution, publishes the sigstore bundle for values.json
      # as a release asset, and creates the release. A consumer then fetches
      # that bundle beside values.json with a plain download, so importing this
      # release needs no GitHub API token.
      - name: Attest and Release
        uses: diskuv/dk-distribute/attest-release@v3
